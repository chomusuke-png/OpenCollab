name: Idea or feedback
description: Something missing, confusing or that could work better
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like
      description: What you were trying to do, what got in the way, and what would help.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Hosting and invitations
        - Joining and connecting
        - Editing together
        - Run, debug and tests on the host
        - Chat and participants
        - Settings
        - Relay server
        - Something else
  - type: textarea
    id: compared
    attributes:
      label: Compared with other tools
      description: If you have used Code With Me, Live Share or similar, what did they do better or worse?
