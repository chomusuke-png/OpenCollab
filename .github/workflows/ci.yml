# Builds every module, runs all tests and the Plugin Verifier on each push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # The version is computed from the release tags and the commits since the last one.
          fetch-depth: 0

      # core, transport and relay-server build on Java 21; the plugin on Java 25.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew check buildPlugin --continue --stacktrace

      - name: Verify plugin compatibility
        run: ./gradlew :plugin:verifyPlugin --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: OpenCollab-plugin
          path: plugin/build/distributions/*.zip
          retention-days: 14
