# Builds every module, runs all tests and the Plugin Verifier on each push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # The version is computed from the release tags and the commits since the last one.
          fetch-depth: 0

      # core, transport and relay-server build on Java 21; the plugin on Java 25.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew check buildPlugin --continue --stacktrace

      - name: Verify plugin compatibility
        run: ./gradlew :plugin:verifyPlugin --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: OpenCollab-plugin
          path: plugin/build/distributions/*.zip
          retention-days: 14

  relay-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check the compose files
        working-directory: relay-server/docker
        run: |
          echo "ci-only-secret-0123456789" > relay-secret.txt
          docker compose -f compose.yml config --quiet
          RELAY_DOMAIN=relay.example.com docker compose -f compose.caddy.yml config --quiet
          docker compose -f compose.yml -f compose.build.yml config --quiet
          RELAY_DOMAIN=relay.example.com docker compose -f compose.caddy.yml -f compose.build.yml config --quiet

      - name: Build the image
        run: docker build -f relay-server/Dockerfile --build-arg VERSION=ci -t opencollab-relay:ci .

      # Starts the relay twice on the same volume: TLS must answer with the fingerprint it
      # prints, and the kept certificate must give the same fingerprint after a restart.
      - name: Smoke test
        run: |
          fingerprint() {
            for i in $(seq 1 30); do
              printed=$(docker logs relay 2>&1 | sed -n 's/.*fingerprint (SHA-256): //p' | tail -1)
              [ -n "$printed" ] && break
              sleep 1
            done
            for i in $(seq 1 30); do
              served=$(openssl s_client -connect 127.0.0.1:8443 </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256 2>/dev/null | sed 's/.*=//')
              [ -n "$served" ] && break
              sleep 1
            done
            [ -n "$printed" ] && [ "$printed" = "$served" ] || { docker logs relay >&2; echo "printed '$printed' served '$served'" >&2; exit 1; }
            echo "$served"
          }
          start() {
            docker run -d --name relay -p 8443:8443 -v relay-data:/data opencollab-relay:ci \
              --self-signed --keep-certificate /data/relay.p12 --allow-anonymous-hosts
          }
          start
          first=$(fingerprint)
          docker rm -f relay
          start
          second=$(fingerprint)
          docker rm -f relay
          echo "first $first"; echo "second $second"
          [ "$first" = "$second" ]

      # Both installers with the image built above (not the published one) and this checkout's
      # compose files: what they print must match what the relay serves, and running them
      # again must update without changing the secret or the certificate.
      - name: Installers
        env:
          OPENCOLLAB_SOURCE: ${{ github.workspace }}/relay-server/docker
          OPENCOLLAB_PULL: missing
        run: |
          docker tag opencollab-relay:ci ghcr.io/chomusuke-png/opencollab-relay:ci
          served() {
            for i in $(seq 1 30); do
              f=$(openssl s_client -connect "127.0.0.1:$1" </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256 2>/dev/null | sed 's/.*=//')
              [ -n "$f" ] && { echo "$f"; return; }
              sleep 1
            done
          }
          check() { # check <name> <port> <dir> <install command...>
            name=$1 port=$2 dir=$3; shift 3
            "$@" > "out-$name-1.txt"
            printed=$(sed -n 's/.*fingerprint: *\([0-9A-F:]*\)$/\1/p' "out-$name-1.txt")
            secret=$(cat "$dir/relay-secret.txt")
            [ -n "$printed" ] && [ "$printed" = "$(served "$port")" ] || { cat "out-$name-1.txt"; echo "$name: printed '$printed', served '$(served "$port")'" >&2; exit 1; }
            grep -qF "$secret" "out-$name-1.txt" || { echo "$name: secret not shown" >&2; exit 1; }
            "$@" > "out-$name-2.txt"
            [ "$secret" = "$(cat "$dir/relay-secret.txt")" ] && [ "$printed" = "$(served "$port")" ] || { cat "out-$name-2.txt"; echo "$name: the update changed the secret or the certificate" >&2; exit 1; }
            (cd "$dir" && docker compose down -v)
            echo "$name ok: $printed"
          }
          check sh 8444 "$RUNNER_TEMP/relay-sh" sh relay-server/install.sh --yes --dir "$RUNNER_TEMP/relay-sh" --port 8444 --version ci
          check ps1 8445 "$RUNNER_TEMP/relay-ps1" pwsh -NoProfile -File relay-server/install.ps1 -Yes -Dir "$RUNNER_TEMP/relay-ps1" -Port 8445 -Version ci
