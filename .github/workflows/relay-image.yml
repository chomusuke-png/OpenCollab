# Publishes the relay server image to the GitHub Container Registry for each release:
#   ghcr.io/chomusuke-png/opencollab-relay:<X.Y.Z>, <X.Y>, <X> and latest
# for linux/amd64 and linux/arm64. Run it by hand to publish the image of an existing release.
name: Relay image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v3.9.0
        required: true

concurrency:
  group: relay-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/opencollab-relay
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check the tag
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Not a release tag: $TAG" >&2; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}

      # The same check as in CI, on the image about to be published: TLS answers with the
      # fingerprint the relay prints.
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: relay-server/Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          load: true
          tags: opencollab-relay:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name relay -p 8443:8443 opencollab-relay:smoke --self-signed --allow-anonymous-hosts
          for i in $(seq 1 30); do
            printed=$(docker logs relay 2>&1 | sed -n 's/.*fingerprint (SHA-256): //p' | tail -1)
            served=$(openssl s_client -connect 127.0.0.1:8443 </dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256 2>/dev/null | sed 's/.*=//')
            [ -n "$printed" ] && [ "$printed" = "$served" ] && { echo "ok $served"; exit 0; }
            sleep 1
          done
          docker logs relay >&2
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: relay-server/Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
