settings.forwarding.enable.comment=Forward TCP on the router to this computer and listen port, and use a fixed listen port (not 0).
settings.forwarding.public=Public address:
settings.forwarding.public.comment=Public IP or DNS name of your router (e.g. a dynamic DNS name). Empty: detected when the session starts.
settings.forwarding.detect=Detect
