settings.forwarding.service=Public IP service:
settings.forwarding.service.comment=HTTPS service returning your IP as plain text. Only contacted when detecting the public address.
error.forwarding.port=Port forwarding needs a fixed listen port; set Port to the port you forwarded (e.g. 47800)
