# Connection hints
hint.timeout=The host did not answer. Check that the host firewall allows inbound TCP on the session port (Windows: allow the IDE on Private networks), that both computers are on the same network or VPN, or use the relay.
bridge.too.large.upload={0} is larger than {1} MB and cannot be uploaded from a guest; ask the host to add it
settings.max.size.comment=Up to 2048 MB. Large files are streamed in chunks with flow control; guests can upload files up to 8 MB.
hint.other.network=The host advertised {0}, which belongs to a different private network than this computer, so a direct connection cannot reach it. Ask the host to enable port forwarding (Settings | Tools | OpenCollab | Port Forwarding) and send a new invitation, or to use the relay, or connect both computers with a VPN (e.g. Tailscale or ZeroTier).
hint.forwarding.failed=The host public address {0} did not answer. On the host router, forward TCP port {1} to the host computer, allow it in the host firewall, and check that the router has a real public IP (carrier-grade NAT/CGNAT cannot forward ports; use the relay or a VPN then).

# Port forwarding
