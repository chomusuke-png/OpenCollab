settings.router.enable.comment=Mientras hospedas, OpenCollab le pide a tu router que reenv\u00ede el puerto de escucha a este equipo, y lo quita al terminar la sesi\u00f3n. Desactivado por defecto. No todos los routers lo permiten; si el tuyo no, reenv\u00eda el puerto a mano aqu\u00ed abajo o usa un relay.
settings.router.confirm.title=\u00bfAbrir un puerto a internet?
settings.router.confirm=Mientras hospedes una sesi\u00f3n, OpenCollab le pedir\u00e1 a tu router (con UPnP o NAT-PMP) que reenv\u00ede un puerto TCP, el de escucha, desde internet a este equipo.\n\nCualquiera en internet podr\u00e1 llegar a ese puerto. Solo entra quien tenga una invitaci\u00f3n: las conexiones van cifradas y se comprueban con el certificado de esta sesi\u00f3n. Los dem\u00e1s servicios de este equipo no quedan expuestos.\n\nEl reenv\u00edo se quita al terminar la sesi\u00f3n; si el IDE se cierra de golpe, el router lo borra en una hora como mucho (o, en algunos routers, lo mantiene hasta que lo quites ah\u00ed).\n\nOpenCollab no env\u00eda datos del router ni de tu red a ning\u00fan sitio. No todos los routers lo permiten, y no sirve detr\u00e1s de un CGNAT.\n\nPuedes desactivarlo aqu\u00ed cuando quieras, tambi\u00e9n mientras hospedas.
settings.router.confirm.ok=Activar
router.searching=Router: buscando un router que permita el reenv\u00edo autom\u00e1tico de puertos\u2026
router.found=Router: se encontr\u00f3 un router {0}, pidi\u00e9ndole que reenv\u00ede el puerto\u2026
router.mapped=Router ({0}): reenv\u00eda el puerto de internet {1} a este equipo (puerto {2}). Las invitaciones nuevas incluyen {3}. Un firewall a\u00fan puede bloquearlo.
router.renewal.failed=Router: no se pudo renovar el reenv\u00edo ({0}); se reintenta en un minuto. Puede que los invitados desde internet no puedan conectarse.
router.removed=Router: se quit\u00f3 el reenv\u00edo del puerto.
router.cancelled=Se detuvo el reenv\u00edo autom\u00e1tico de puertos
router.failed.title=El reenv\u00edo autom\u00e1tico de puertos no funcion\u00f3
router.failed.none=Router: ning\u00fan router respondi\u00f3 (puede que UPnP y NAT-PMP est\u00e9n desactivados en \u00e9l o no los soporte). Hay que reenviar el puerto a mano.
router.failed.cgnat=Router: su direcci\u00f3n de internet no es p\u00fablica (CGNAT o un segundo router), as\u00ed que reenviar el puerto no puede llegar a este equipo.
router.failed.taken=Router: el puerto ya se reenv\u00eda a otra cosa ({0}).
router.failed=Router: no se reenvi\u00f3 el puerto ({0}).
router.failed.bind=Router: el reenv\u00edo autom\u00e1tico necesita la direcci\u00f3n de escucha 0.0.0.0 o la direcci\u00f3n LAN de este equipo, no 127.0.0.1.
router.fallback=Las personas en esta red pueden unirse igual. Para internet, reenv\u00eda el puerto a mano (Settings | Tools | OpenCollab | Port Forwarding) o usa un relay.
router.fallback.relay=Las personas pueden unirse igual por el relay.
