# Pistas de conexi\u00f3n
hint.timeout=El anfitri\u00f3n no respondi\u00f3. Comprueba que su firewall permita conexiones TCP entrantes al puerto de la sesi\u00f3n (Windows: permitir el IDE en redes privadas), que ambos equipos est\u00e9n en la misma red o VPN, o usa el relay.
bridge.too.large.upload={0} supera {1} MB y no se puede subir desde un invitado; pide al anfitri\u00f3n que lo agregue
settings.max.size.comment=Hasta 2048 MB. Los archivos grandes se transfieren por partes con control de flujo; los invitados pueden subir archivos de hasta 8 MB.
hint.other.network=El anfitri\u00f3n anunci\u00f3 {0}, que pertenece a otra red privada distinta de la de este equipo, por lo que una conexi\u00f3n directa no puede llegar. Pide al anfitri\u00f3n que active la redirecci\u00f3n de puertos (Ajustes | Herramientas | OpenCollab | Redirecci\u00f3n de puertos) y env\u00ede una invitaci\u00f3n nueva, o que use el relay, o conecta ambos equipos con una VPN (p. ej. Tailscale o ZeroTier).
hint.forwarding.failed=La direcci\u00f3n p\u00fablica del anfitri\u00f3n {0} no respondi\u00f3. En el router del anfitri\u00f3n, redirige el puerto TCP {1} a su equipo, perm\u00edtelo en su firewall y comprueba que el router tenga una IP p\u00fablica real (con CGNAT del proveedor no se pueden abrir puertos; usa entonces el relay o una VPN).

